[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "unimpeded"
dynamic = ["version"]
authors = [
    { name="Will Handley", email="williamjameshandley@gmail.com" },
]
description = "Universal model comparison & parameter estimation over diverse datasets"
readme = "README.rst"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "requests",
    "anesthetic",
    "pyyaml",
    # Imported directly by unimpeded.tension, not merely via anesthetic:
    # numpy for the correction factors, scipy for erfcinv and chi2. They
    # resolve today only because anesthetic happens to require them, which
    # would break silently if it ever stopped.
    "numpy",
    "scipy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
download-unimpeded-tutorial = "unimpeded.cli:download_unimpeded_tutorial"
launch-unimpeded-tutorial = "unimpeded.cli:launch_unimpeded_tutorial"

[project.urls]
"Homepage" = "https://github.com/handley-lab/unimpeded"
"Bug Tracker" = "https://github.com/handley-lab/unimpeded/issues"
"Documentation" = "https://unimpeded.readthedocs.io/en/latest/"

[project.optional-dependencies]
docs = ["sphinx", "sphinx_rtd_theme", "numpydoc"]
test = ["pytest", "pytest-cov", "flake8", "pydocstyle", "packaging", "pre-commit", "pytest-recording"]

[tool.setuptools.packages.find]
include = ["unimpeded*"]

[tool.setuptools.dynamic]
version = {attr = "unimpeded._version.__version__"}

[tool.isort]
profile = "black"
